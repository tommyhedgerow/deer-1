<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="An index of the characters in James Heisig's Remembering the Hanzi — browse by order, script and tone." />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300..700;1,300..700&family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Apply the saved (or system) theme before first paint to avoid a flash.
			(function () {
				try {
					var stored = localStorage.getItem('hanzi-theme');
					var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
					var el = document.documentElement;
					el.classList.toggle('dark', dark);
					el.style.colorScheme = dark ? 'dark' : 'light';
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
